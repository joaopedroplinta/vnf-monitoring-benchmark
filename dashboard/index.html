<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VNF Lab | Benchmark de monitoramento</title>
    <meta name="description" content="Dashboard interativo dos resultados do TCC: sobrecarga de monitoramento de uma VNF com eBPF, Sysstat, Prometheus e Docker." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Aplica o tema salvo antes da primeira pintura, sem piscar.
      try {
        var t = localStorage.getItem("vnf-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
