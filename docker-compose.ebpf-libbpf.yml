services:

  waf:
    build:
      context: .
      dockerfile: configs/Dockerfile.ebpf-libbpf
    container_name: waf-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - ./results:/app/results
    command: ["python3", "/app/vnf/waf.py"]

  observador:
    build:
      context: .
      dockerfile: configs/Dockerfile.ebpf-libbpf
    container_name: observador
    network_mode: "host"
    pid: "host"
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - ./src/vnf:/app/vnf
      - ./results:/app/results
    command: ["bash", "/app/vnf/ebpf_entrypoint.sh"]
    depends_on:
      - waf

  client:
    build:
      context: .
      dockerfile: configs/Dockerfile.client
    container_name: socket-client
    network_mode: "host"
    environment:
      - PAYLOADS_FILE=${PAYLOADS_FILE}
      - WORKERS=${WORKERS:-10}
    volumes:
      - ./src/client:/app
      - ./data/payloads:/app/payloads:ro
    command: ["python3", "/app/client.py"]
    depends_on:
      - waf

  ebpf-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile.ebpf-libbpf
    container_name: ebpf-collector
    network_mode: "host"
    environment:
      - COLLECTOR=ebpf
      - RESULTS_PATH=${RESULTS_PREFIX_CONT:-/app/results}/ebpf_${NUM_MESSAGES:-100}_run${RUN_ID:-1}_results.json
      - DURATION=${DURATION:-100}
    volumes:
      - ./src:/app/src
      - ./results:/app/results
    command: ["python3", "/app/src/probe.py"]
    depends_on:
      - observador
