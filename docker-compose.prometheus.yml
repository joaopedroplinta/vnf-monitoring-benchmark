services:

  waf:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: waf-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/waf.py

  monitor-server:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: monitor-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/monitor_server.py
    depends_on:
      - waf

  client:
    build:
      context: .
      dockerfile: configs/Dockerfile.client
    container_name: socket-client
    network_mode: "host"
    volumes:
      - ./src/client:/app
    command: python3 /app/client.py
    depends_on:
      - waf

  prometheus-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: prometheus-collector
    network_mode: "host"
    volumes:
      - ./src/prometheus:/app/prometheus
      - results_vol:/app/results
    command: python3 /app/prometheus/exporter.py
    depends_on:
      - monitor-server

volumes:
  results_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/results