services:

  waf:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: waf-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/waf.py

  monitor-server:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: monitor-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/monitor_server.py
    depends_on:
      - waf

  client:
    build:
      context: .
      dockerfile: configs/Dockerfile.client
    container_name: socket-client
    network_mode: "host"
    environment:
      - NUM_MESSAGES=${NUM_MESSAGES:-100}
    volumes:
      - ./src/client:/app
    command: python3 /app/client.py
    depends_on:
      - waf

  sysstat-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: sysstat-collector
    network_mode: "host"
    environment:
      - DURATION=${DURATION:-100}
    volumes:
      - ./src/sysstat:/app/sysstat
      - results_vol:/app/results
    command: python3 /app/sysstat/collector.py
    depends_on:
      - monitor-server

volumes:
  results_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/results