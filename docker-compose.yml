services:

  # ── VNF: WAF TCP :8080 ───────────────────────────────────────────────────────
  waf:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: waf-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/waf.py

  # ── VNF: Monitor UDP :9999 ───────────────────────────────────────────────────
  # ATENÇÃO: cada ferramenta tem seu próprio monitor (monitor_ebpf/sysstat/prometheus.py).
  # Use os composes específicos: docker-compose.ebpf.yml / sysstat / prometheus.
  # Este compose genérico não pode rodar as 3 ferramentas simultaneamente (conflito porta 9999).
  monitor-server:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: monitor-server
    network_mode: "host"
    volumes:
      - ./src/vnf:/app/vnf
      - results_vol:/app/results
    command: python3 /app/vnf/monitor_ebpf.py
    depends_on:
      - waf

  # ── Cliente TCP → bombardeia o WAF ──────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: configs/Dockerfile.client
    container_name: socket-client
    network_mode: "host"
    volumes:
      - ./src/client:/app
    command: python3 /app/client.py
    depends_on:
      - waf

  # ── Coletor eBPF ─────────────────────────────────────────────────────────────
  ebpf-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: ebpf-collector
    pid: "host"
    privileged: true
    network_mode: "host"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./src:/app/src
      - results_vol:/app/results
    command: python3 /app/src/probe.py
    depends_on:
      - monitor-server

  # ── Coletor sysstat ──────────────────────────────────────────────────────────
  sysstat-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: sysstat-collector
    network_mode: "host"
    volumes:
      - ./src:/app/src
      - results_vol:/app/results
    command: python3 /app/src/probe.py
    depends_on:
      - monitor-server

  # ── Coletor Prometheus ───────────────────────────────────────────────────────
  prometheus-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: prometheus-collector
    network_mode: "host"
    volumes:
      - ./src:/app/src
      - results_vol:/app/results
    command: python3 /app/src/probe.py
    depends_on:
      - monitor-server

  # ── Comparador ───────────────────────────────────────────────────────────────
  comparator:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: comparator
    network_mode: "host"
    volumes:
      - ./src:/app/src
      - results_vol:/app/results
    command: >
      sh -c "
        echo '⏳ Aguardando coletores...' &&
        sleep 480 &&
        echo '📊 Gerando relatório...' &&
        python3 /app/src/compare.py
      "
    depends_on:
      - ebpf-collector
      - sysstat-collector
      - prometheus-collector

volumes:
  results_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/results