version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: socket-server
    ports:
      - "9999:9999"
    networks:
      - socket-net
    volumes:
      - ./server:/app

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: socket-client
    networks:
      - socket-net
    depends_on:
      - server
    volumes:
      - ./client:/app

  ebpf-monitor:
    build:
      context: .
      dockerfile: Dockerfile.ebpf
    container_name: ebpf-monitor
    pid: "host"
    privileged: true
    network_mode: "host"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    command: python3 /ebpf/monitor_bcc.py

networks:
  socket-net:
    driver: bridge