version: '3.8'

services:

  # ── Servidor socket ──────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: configs/Dockerfile.server
    container_name: socket-server
    ports:
      - "9999:9999"
    networks:
      - socket-net
    volumes:
      - ./src/socket:/app
    command: python server.py

  # ── Cliente socket ───────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: configs/Dockerfile.client
    container_name: socket-client
    networks:
      - socket-net
    depends_on:
      - server
    volumes:
      - ./src/socket:/app
    command: python client.py

  # ── Coletor eBPF ─────────────────────────────────────────────────────────────
  ebpf-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: ebpf-collector
    pid: "host"
    privileged: true
    network_mode: "host"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./src/ebpf:/app/ebpf
      - results_vol:/app/results
    command: python3 /app/ebpf/monitor_bcc.py
    depends_on:
      - server

  # ── Coletor sysstat ──────────────────────────────────────────────────────────
  sysstat-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: sysstat-collector
    network_mode: "host"
    pid: "host"
    volumes:
      - ./src/sysstat:/app/sysstat
      - results_vol:/app/results
    command: python3 /app/sysstat/collector.py
    depends_on:
      - server

  # ── Coletor Prometheus ───────────────────────────────────────────────────────
  prometheus-collector:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: prometheus-collector
    network_mode: "host"   # porta 8000 já acessível automaticamente no host
    pid: "host"
    volumes:
      - ./src/prometheus:/app/prometheus
      - results_vol:/app/results
    command: python3 /app/prometheus/exporter.py
    depends_on:
      - server

  # ── Comparador (roda ao final) ───────────────────────────────────────────────
  comparator:
    build:
      context: .
      dockerfile: configs/Dockerfile
    container_name: comparator
    volumes:
      - ./src:/app/src
      - results_vol:/app/results
    command: python3 /app/src/compare.py
    depends_on:
      - ebpf-collector
      - sysstat-collector
      - prometheus-collector
    profiles:
      - compare   # só roda quando chamado explicitamente

volumes:
  results_vol:   # volume compartilhado entre todos os coletores

networks:
  socket-net:
    driver: bridge
