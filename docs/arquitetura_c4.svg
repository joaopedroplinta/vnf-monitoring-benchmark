<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="white"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="510" fill="#0d0d0d"/>

  <!-- ═══════════════════════════════════════════
       VNF  (left, orange)
  ═══════════════════════════════════════════ -->
  <rect x="27" y="27" width="228" height="458" rx="4" fill="#3d1500"/>
  <rect x="19" y="19" width="228" height="458" rx="4" fill="#221000" stroke="#cc7700" stroke-width="2"/>
  <text x="31" y="45" font-family="monospace" font-size="17" font-weight="bold"
        fill="white" text-decoration="underline">VNF</text>

  <!-- 1. Observador — monitoring tool + UDP server (mesmo contêiner) -->
  <rect x="46" y="64"  width="170" height="125" rx="2" fill="#1a1a1a"/>
  <rect x="39" y="57"  width="170" height="125" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>

  <!-- Port badge :9999 -->
  <rect x="168" y="59" width="38" height="14" rx="3" fill="#cc7700"/>
  <text x="187" y="70" font-family="monospace" font-size="9" fill="white" text-anchor="middle">:9999</text>

  <!-- Icon (monitoring mechanism) -->
  <rect x="49" y="73"  width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <rect x="49" y="86"  width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="56" y1="73"  x2="56" y2="68"  stroke="#888" stroke-width="1"/>
  <line x1="56" y1="94"  x2="56" y2="99"  stroke="#888" stroke-width="1"/>

  <!-- Text: monitoring mechanism -->
  <text x="74" y="79"  font-family="monospace" font-size="10" fill="#999">coleta de métricas</text>
  <text x="74" y="94"  font-family="monospace" font-size="10" fill="white"><tspan font-weight="bold">eBPF</tspan> / sysstat / prom.</text>
  <text x="74" y="109" font-family="monospace" font-size="9"  fill="#aaa">bytes RX/TX + CPU/mem</text>
  <text x="74" y="124" font-family="monospace" font-size="8"  fill="#666">1 variante por experimento</text>

  <!-- Separator -->
  <line x1="48" y1="133" x2="200" y2="133" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Text: UDP server -->
  <text x="74" y="149" font-family="monospace" font-size="11" fill="#999">UDP Socket</text>
  <text x="74" y="165" font-family="monospace" font-size="12" fill="white"><tspan font-weight="bold">Observador</tspan></text>

  <!-- Seta interna: Observador → WAF -->
  <line x1="195" y1="182" x2="195" y2="305"
        stroke="#555" stroke-width="1" stroke-dasharray="3,2"
        marker-end="url(#arr-gray)"/>
  <text x="203" y="244" font-family="monospace" font-size="9" fill="#555"
        text-anchor="middle"
        transform="rotate(-90, 203, 244)">monitora</text>

  <!-- 2. WAF (alinhado com Client à direita) -->
  <rect x="46" y="314" width="170" height="70" rx="2" fill="#1a1a1a"/>
  <rect x="39" y="307" width="170" height="70" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>
  <rect x="49" y="323" width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <rect x="49" y="336" width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="56" y1="323" x2="56" y2="318" stroke="#888" stroke-width="1"/>
  <line x1="56" y1="344" x2="56" y2="349" stroke="#888" stroke-width="1"/>
  <text x="74" y="334" font-family="monospace" font-size="11" fill="#999">TCP Socket</text>
  <text x="74" y="350" font-family="monospace" font-size="12" fill="white">WAF <tspan font-weight="bold">Server</tspan></text>
  <rect x="172" y="306" width="38" height="14" rx="3" fill="#cc7700"/>
  <text x="191" y="317" font-family="monospace" font-size="9" fill="white" text-anchor="middle">:8080</text>

  <!-- ═══════════════════════════════════════════
       Probe  (right top, green)
  ═══════════════════════════════════════════ -->
  <rect x="457" y="27"  width="222" height="220" rx="4" fill="#073d1a"/>
  <rect x="449" y="19"  width="222" height="220" rx="4" fill="#041a0a" stroke="#00aa44" stroke-width="2"/>
  <text x="461" y="45" font-family="monospace" font-size="17" font-weight="bold"
        fill="white" text-decoration="underline">Probe</text>

  <!-- probe.py -->
  <rect x="475" y="64"  width="170" height="70" rx="2" fill="#0a200a"/>
  <rect x="468" y="57"  width="170" height="70" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>
  <rect x="478" y="73"  width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <rect x="478" y="86"  width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="485" y1="73" x2="485" y2="68"  stroke="#888" stroke-width="1"/>
  <line x1="485" y1="94" x2="485" y2="99"  stroke="#888" stroke-width="1"/>
  <text x="503" y="84"  font-family="monospace" font-size="11" fill="#999">UDP Socket</text>
  <text x="503" y="100" font-family="monospace" font-size="12" fill="white"><tspan font-weight="bold">probe.py</tspan>  1 req/s</text>

  <!-- results -->
  <rect x="475" y="153" width="170" height="62" rx="2" fill="#0a200a"/>
  <rect x="468" y="146" width="170" height="62" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>
  <text x="483" y="163" font-family="monospace" font-size="10" fill="#888">saída</text>
  <text x="483" y="179" font-family="monospace" font-size="11" fill="white">→ <tspan font-weight="bold">*_N_results.json</tspan></text>
  <text x="483" y="198" font-family="monospace" font-size="9"  fill="#555">RTT medido a cada probe</text>

  <!-- ═══════════════════════════════════════════
       Client  (right bottom, blue)
  ═══════════════════════════════════════════ -->
  <rect x="457" y="277" width="222" height="200" rx="4" fill="#071428"/>
  <rect x="449" y="269" width="222" height="200" rx="4" fill="#040d1a" stroke="#2266cc" stroke-width="2"/>
  <text x="461" y="295" font-family="monospace" font-size="17" font-weight="bold"
        fill="white" text-decoration="underline">Client</text>

  <!-- client.py -->
  <rect x="475" y="314" width="170" height="70" rx="2" fill="#071428"/>
  <rect x="468" y="307" width="170" height="70" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>
  <rect x="478" y="323" width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <rect x="478" y="336" width="15" height="8" rx="1" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="485" y1="323" x2="485" y2="318" stroke="#888" stroke-width="1"/>
  <line x1="485" y1="344" x2="485" y2="349" stroke="#888" stroke-width="1"/>
  <text x="503" y="333" font-family="monospace" font-size="11" fill="#999">TCP Socket</text>
  <text x="503" y="349" font-family="monospace" font-size="12" fill="white"><tspan font-weight="bold">client.py</tspan></text>

  <!-- payload note -->
  <rect x="475" y="396" width="170" height="42" rx="2" fill="#071428"/>
  <rect x="468" y="389" width="170" height="42" rx="2" fill="#131313" stroke="#555" stroke-width="1"/>
  <text x="483" y="406" font-family="monospace" font-size="9" fill="#777">60% benigno / 40% malicioso</text>
  <text x="483" y="421" font-family="monospace" font-size="9" fill="#777">seed fixa — reprodutível</text>

  <!-- ═══════════════════════════════════════════
       SETAS
  ═══════════════════════════════════════════ -->

  <!-- 1. Probe → Observador (Sonda ativa) -->
  <line x1="468" y1="94" x2="209" y2="94"
        stroke="white" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arr)"/>
  <text x="338" y="70" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Sonda ativa</text>
  <text x="338" y="84" font-family="monospace" font-size="10" fill="#aaa"  text-anchor="middle">UDP, 1 req/s</text>

  <!-- 2. Observador → Probe/saída (Resposta reativa) -->
  <line x1="209" y1="172" x2="468" y2="172"
        stroke="white" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arr)"/>
  <text x="338" y="188" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Resposta reativa</text>
  <text x="338" y="202" font-family="monospace" font-size="10" fill="#aaa"  text-anchor="middle">JSON de métricas</text>

  <!-- 3. Client → WAF (Tráfego TCP) -->
  <line x1="468" y1="342" x2="209" y2="342"
        stroke="white" stroke-width="1.5" stroke-dasharray="6,3"
        marker-end="url(#arr)"/>
  <text x="338" y="326" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Tráfego TCP</text>
  <text x="338" y="340" font-family="monospace" font-size="10" fill="#aaa"  text-anchor="middle">TCP :8080</text>

  <!-- C4 level label -->
  <text x="350" y="497" font-family="monospace" font-size="9" fill="#777" text-anchor="middle">C4 — Container Diagram (Nível 2)</text>
</svg>
